# Publica en GitHub Pages en cada push a main (app estática, sin build). Política de pruebas: spec §5.
# Solo se publica lo que la app carga y las licencias que enlaza su pie; scripts/, docs/ y tests/ no salen.
# Acciones fijadas por SHA de commit (la versión va en el comentario); al actualizarlas, cambiar ambos.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Comprobar coherencia de datos
        run: python3 scripts/verificar_datos.py
      - name: Preparar el sitio
        run: |
          mkdir _site
          cp -r index.html app vendor data modelos LICENSE LICENSES.md _site/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: desplegar
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
