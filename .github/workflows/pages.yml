# Publica el módulo en GitHub Pages en cada push a main. La app es estática y sin build: se sirve el
# repositorio tal cual, menos la hoja de revisión clínica (lleva nombres de revisores y la app no la usa).
# Antes de desplegar comprueba que los datos son coherentes (scripts/verificar_datos.py, sin dependencias).
# La prueba de humo (tests/humo.mjs) no se ejecuta aquí: necesita Playwright y se pasa a mano antes de mezclar.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue en curso se deja terminar (misma pauta que la plantilla oficial de Pages): el siguiente espera.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar coherencia de datos
        run: python3 scripts/verificar_datos.py
      - name: Quitar del sitio la hoja de revisión clínica
        run: rm data/revision-nombres-nl-pap.csv
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: desplegar
        uses: actions/deploy-pages@v4
