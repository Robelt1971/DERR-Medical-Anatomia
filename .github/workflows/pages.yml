# Publica el repositorio tal cual en GitHub Pages en cada push a main (app estática, sin build). Política de pruebas: spec §5.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.desplegar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar coherencia de datos
        run: python3 scripts/verificar_datos.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: desplegar
        uses: actions/deploy-pages@v4
